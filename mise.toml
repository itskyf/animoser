[tools]
actionlint = "latest"
aube = { version = "latest", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
biome = "latest"
ghalint = "latest"
"github:microsoft/apm" = "latest"
hk = "latest"
pixi = "latest"
ruff = "latest"
rumdl = "latest"
tombi = "latest"

[deps.apm]
sources = ["apm.yml", "apm.lock.yaml"]
outputs = ["apm_modules"]
run = "apm install --frozen"

[deps.pixi]
sources = ["pyproject.toml", "pixi.lock"]
outputs = [".pixi/envs/default", ".pixi/envs/dev"]
run = "pixi install --all --locked"
