[project]
name = "animoser"
requires-python = ">= 3.13"
authors = [{ name = "Kỳ", email = "40734986+itskyf@users.noreply.github.com" }]
dependencies = ["pydantic>=2.14.1,<3", "rustwright>=0.3.0,<0.4", "typer>=0.27.3,<0.28"]
dynamic = ["version"]

[dependency-groups]
dev = ["google-colab-cli>=0.7.4,<0.8", "ipykernel>=7.4.0,<8", "pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2"]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
animoser = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
cxx-compiler = ">=2.0.0,<3"
ffmpeg = ">=9.0.2,<10"
python = ">=3.13,<3.14"
